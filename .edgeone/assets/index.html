<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桥艺十分钟年刊 · 主站</title>
<style>
  :root{
    --brown:#8B7355; --brown-d:#6f5c44; --green:#2d5016; --orange:#e67e22;
    --ink:#2b2118; --paper:#f3ead9; --line:#cdbfa6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--brown);color:var(--paper);-webkit-text-size-adjust:100%;}
  header{background:var(--green);padding:18px 16px 14px;position:sticky;top:0;z-index:5;
    box-shadow:0 2px 10px rgba(0,0,0,.35);}
  header h1{margin:0;font-size:20px;letter-spacing:2px;color:#fff;}
  header p{margin:4px 0 0;font-size:12px;opacity:.8;}
  .wrap{max-width:760px;margin:0 auto;padding:14px;}
  /* 搜索 */
  .search{width:100%;padding:11px 14px;font-size:15px;border-radius:10px;border:none;
    background:var(--paper);color:var(--ink);outline:none;}
  /* 年 tabs */
  .years{display:flex;gap:10px;margin:14px 0;}
  .ytab{flex:1;text-align:center;padding:14px 0;border-radius:12px;cursor:pointer;
    background:var(--brown-d);color:var(--paper);font-size:16px;font-weight:600;
    border:2px solid transparent;transition:.15s;user-select:none;}
  .ytab.active{background:var(--orange);color:#fff;border-color:#fff;}
  .ytab small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:3px;}
  /* 期 grid */
  .issues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .icard{background:var(--brown-d);border-radius:12px;padding:12px;cursor:pointer;
    border:2px solid transparent;transition:.15s;user-select:none;}
  .icard:hover{border-color:var(--orange);}
  .icard .mt{font-size:16px;font-weight:700;}
  .icard .mc{font-size:11px;opacity:.8;margin-top:3px;}
  /* 牌例列表 */
  .panel{margin-top:14px;background:var(--brown-d);border-radius:12px;padding:6px 4px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px 10px;font-size:14px;color:#fff;}
  .back{cursor:pointer;background:var(--green);color:#fff;border:none;border-radius:8px;
    padding:6px 12px;font-size:13px;}
  .deal{display:block;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);
    color:var(--paper);text-decoration:none;font-size:14px;}
  .deal:last-child{border-bottom:none;}
  .deal:hover{background:rgba(230,126,34,.25);}
  .deal .idx{display:inline-block;width:26px;color:var(--orange);font-weight:700;}
  .hidden{display:none;}
  .empty{text-align:center;opacity:.7;padding:30px;font-size:14px;}
  footer{text-align:center;font-size:11px;opacity:.6;padding:20px;}
</style>
</head>
<body>
<header>
  <h1>桥艺十分钟年刊</h1>
  <p>三年 36 期 · 点击进入牌例互动页面</p>
</header>

  <input id="q" class="search" placeholder="搜索牌例（如：做庄 / 防守 / i03）" oninput="onSearch()">

  <div id="issues" class="issues"></div>
  <div id="panel" class="panel hidden"></div>
  <div id="empty" class="empty hidden">无匹配结果</div>
</div>

const years = Object.keys(DATA);
const yearLabels = {year01:"年刊 01",year02:"年刊 02",year03:"年刊 03"};
let curYear = years[0];
let curIssue = null;

function flatAll(){
  const out=[];
  for(const y of years){
    for(const mo of Object.keys(DATA[y])){
      for(const d of DATA[y][mo]) out.push({y,mo,file:d.file,name:d.name});
    }
  }
  return out;
}
function renderYears(){
  const box=document.getElementById("years"); box.innerHTML="";
  const totals={}; years.forEach(y=>{let n=0;for(const mo of Object.keys(DATA[y]))n+=DATA[y][mo].length;totals[y]=n;});
  years.forEach(y=>{
    const el=document.createElement("div");
    el.className="ytab"+(y===curYear?" active":"");
    el.innerHTML=(yearLabels[y]||y)+"<small>"+totals[y]+" 牌例</small>";
    el.onclick=()=>{curYear=y;curIssue=null;renderYears();renderIssues();document.getElementById("panel").classList.add("hidden");};
    box.appendChild(el);
  });
  document.getElementById("cnt").textContent=flatAll().length;
}
function renderIssues(){
  const box=document.getElementById("issues"); box.innerHTML="";
  const mos=Object.keys(DATA[curYear]).sort();
  mos.forEach(mo=>{
    const list=DATA[curYear][mo];
    const el=document.createElement("div");
    el.className="icard";
    el.innerHTML="<div class='mt'>"+mo+"</div><div class='mc'>"+list.length+" 牌例</div>";
    el.onclick=()=>{curIssue=mo;renderPanel();};
    box.appendChild(el);
  });
}
function renderPanel(){
  const panel=document.getElementById("panel");
  panel.classList.remove("hidden");
  const list=DATA[curYear][curIssue];
  let h="<div class='panel-head'><span>"+yearLabels[curYear]+" · "+curIssue+" （"+list.length+"）</span>"+
        "<button class='back' onclick='closePanel()'>← 返回</button></div>";
  list.forEach((d,i)=>{
    h+="<a class='deal' href='"+encodeURI(d.file)+"' target='_blank'><span class='idx'>"+(i+1)+"</span>"+d.name+"</a>";
  });
  panel.innerHTML=h;
}
function closePanel(){curIssue=null;document.getElementById("panel").classList.add("hidden");}
function onSearch(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const empty=document.getElementById("empty");
  if(!q){empty.classList.add("hidden");renderYears();renderIssues();document.getElementById("panel").classList.add("hidden");return;}
  const all=flatAll().filter(d=>d.name.toLowerCase().includes(q)||d.file.toLowerCase().includes(q));
  const box=document.getElementById("issues"); box.innerHTML="";
  document.getElementById("years").innerHTML="";
  const panel=document.getElementById("panel");
  if(all.length===0){empty.classList.remove("hidden");panel.classList.add("hidden");return;}
  empty.classList.add("hidden");
  let h="<div class='panel-head'><span>搜索 “"+q+"” · "+all.length+" 结果</span></div>";
  all.forEach(d=>{h+="<a class='deal' href='"+encodeURI(d.file)+"' target='_blank'><span class='idx'>"+yearLabels[d.y].slice(-2)+d.mo.slice(1)+"</span>"+d.name+"</a>";});
  panel.innerHTML=h; panel.classList.remove("hidden");
}
renderYears(); renderIssues();
</script>
