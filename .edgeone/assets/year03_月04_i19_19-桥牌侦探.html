<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>19-桥牌侦探 - 桥艺十分钟年刊03月04</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#8B7355;min-height:100vh;max-width:468px;margin:0 auto;color:#333}
.header{background:#000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header .back,.header .reset{background:none;border:none;color:#fff;cursor:pointer}
.header .back{font-size:22px;width:32px}
.header .reset{font-size:14px}
.header .title{font-size:18px;font-weight:bold}
.table-area{background:#2d5016;border-radius:8px;padding:12px;margin:10px}
.hand{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.north-hand{margin-bottom:10px}
.south-hand{margin-top:10px}
.card{background:#fff;border-radius:3px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;box-shadow:1px 1px 2px rgba(0,0,0,.3);user-select:none;flex-shrink:0}
.card.normal{width:34px;height:48px}
.card.big{width:42px;height:60px}
.card.heart,.card.diamond{color:#e74c3c}
.card.spade,.card.club{color:#2c3e50}
.card .suit{font-size:12px;line-height:1}
.card .rank{font-size:16px;line-height:1.1}
.card.big .suit{font-size:14px}
.card.big .rank{font-size:20px}
.side-cards{display:flex;flex-direction:column;gap:1px}
.side-cards .card{width:38px;height:26px;background:linear-gradient(135deg,#e67e22,#d35400);border:1px solid #a04000}
.table-center{position:relative;display:grid;grid-template-columns:44px 1fr 44px;grid-template-rows:auto 1fr auto;gap:8px;align-items:center;min-height:260px;padding:30px 46px}
.seat{position:absolute;z-index:9;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:12px;letter-spacing:1px;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.seat.n{top:4px;left:50%;transform:translateX(-50%)}
.seat.s{bottom:4px;left:50%;transform:translateX(-50%)}
.seat.w{left:4px;top:50%;transform:translateY(-50%)}
.seat.e{right:4px;top:50%;transform:translateY(-50%)}
.side-cards.west{grid-column:1;grid-row:2;align-self:center;justify-self:center}
.side-cards.east{grid-column:3;grid-row:2;align-self:center;justify-self:center}
.bid-area{display:flex;gap:3px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:24px}
.bid-area.n{grid-column:2;grid-row:1}
.bid-area.w{grid-column:1;grid-row:2;flex-direction:column}
.bid-area.e{grid-column:3;grid-row:2;flex-direction:column}
.bid-area.s{grid-column:2;grid-row:3}
.bid{background:#fff;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:bold;box-shadow:1px 1px 2px rgba(0,0,0,.3);white-space:nowrap;opacity:0;transform:scale(.5);transition:all .3s}
.bid.show{opacity:1;transform:scale(1)}
.bid.heart,.bid.diamond{color:#e74c3c}
.bid.spade,.bid.club{color:#2c3e50}
.bid.nt{color:#27ae60}
.play-area{grid-column:2;grid-row:2;display:grid;grid-template-areas:". n ." "w c e" ". s .";grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:1fr 1.6fr 1fr;gap:6px;align-self:stretch;min-height:190px}
.play-slot{display:flex;justify-content:center;align-items:center}
.contract{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#e74c3c;color:#fff;padding:4px 14px;border-radius:5px;font-size:17px;font-weight:bold;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;margin-top:24px}
.contract.show{opacity:1}
.desc{background:#fff;margin:10px;padding:14px;border-radius:8px;font-size:14px;line-height:1.6;min-height:90px}
.controls{display:flex;justify-content:center;gap:12px;padding:10px}
.btn{padding:14px 32px;font-size:15px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;color:#fff;flex:1;max-width:160px}
.btn.prev{background:#888}
.btn.next{background:#e67e22}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{text-align:center;padding:6px 0 14px;color:rgba(255,255,255,.8);font-size:12px}
.info span{color:#e67e22;font-weight:bold}
.hint{text-align:center;padding:0 10px 14px;color:rgba(255,255,255,.5);font-size:11px}
.hint kbd{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;font-size:10px}
.home-btn{position:fixed;right:14px;bottom:16px;z-index:30;background:#e67e22;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:11px 18px;border-radius:24px;box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;gap:5px}
.home-btn:active{transform:scale(.96)}
</style>
</head>

const SS = {spade:'♠', heart:'♥', club:'♣', diamond:'♦'};
let step = 0;
function cardEl(suit, rank, size) {
  const d = document.createElement('div');
  d.className = 'card ' + suit + ' ' + size;
  d.innerHTML = '<span class="suit">' + SS[suit] + '</span><span class="rank">' + rank + '</span>';
  return d;
}
function bidClass(text) {
  if (text.includes('♠')) return 'spade';
  if (text.includes('♥')) return 'heart';
  if (text.includes('♦')) return 'diamond';
  if (text.includes('♣')) return 'club';
  if (text.includes('NT'))    return 'nt';
  return '';
}
function renderHand(elemId, hand) {
  const el = document.getElementById(elemId);
  el.innerHTML = '';
  ['spade','heart','diamond','club'].forEach(s => {
    if (hand[s]) hand[s].forEach(r => el.appendChild(cardEl(s, r, 'normal')));
  });
}
function renderSideCards() {
  ['west','east'].forEach(side => {
    const el = document.getElementById(side + 'Cards');
    el.innerHTML = '';
    for (let i = 0; i < 13; i++) {
      const c = document.createElement('div');
      c.className = 'card';
      el.appendChild(c);
    }
  });
}
function update() {
  ['N','W','E','S'].forEach(p => {
    document.getElementById('bids' + p).innerHTML = '';
    document.getElementById('slot' + p).innerHTML = '';
  });
  document.getElementById('contract').classList.remove('show');
  let lastDesc = '点击「下一步」开始';
  if (step > 0) {
    const bidsByPos = {n:[], w:[], e:[], s:[]};
    const trick = {n:null, w:null, e:null, s:null};
    let contractShown = false;
    for (let i = 0; i < step; i++) {
      const s = DATA.steps[i];
      if (s.type === 'bid') {
        bidsByPos[s.position].push(s);
      } else if (s.type === 'play') {
        if (trick.n && trick.w && trick.e && trick.s) {
          trick.n = trick.w = trick.e = trick.s = null;
        }
        trick[s.position] = {suit: s.suit, rank: s.rank};
        contractShown = true;
      }
      lastDesc = s.desc;
    }
    ['n','w','e','s'].forEach(p => {
      const el = document.getElementById('bids' + p.toUpperCase());
      bidsByPos[p].forEach(b => {
        const chip = document.createElement('div');
        chip.className = 'bid show ' + bidClass(b.text);
        chip.textContent = b.text;
        el.appendChild(chip);
      });
    });
    ['n','w','e','s'].forEach(p => {
      if (trick[p]) {
        document.getElementById('slot' + p.toUpperCase()).appendChild(cardEl(trick[p].suit, trick[p].rank, 'big'));
      }
    });
    if (contractShown) {
      document.getElementById('contract').textContent = DATA.contract;
      document.getElementById('contract').classList.add('show');
    }
  }
  document.getElementById('desc').textContent = lastDesc;
  document.getElementById('curStep').textContent = step;
  document.getElementById('totalStep').textContent = DATA.steps.length;
  document.getElementById('prevBtn').disabled = (step === 0);
  document.getElementById('nextBtn').disabled = (step === DATA.steps.length);
}
function next() { if (step < DATA.steps.length) { step++; update(); } }
function prev() { if (step > 0) { step--; update(); } }
function reset() { step = 0; update(); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
function init() {
  renderHand('northHand', DATA.northHand);
  renderHand('southHand', DATA.southHand);
  renderSideCards();
  update();
}
init();
</script>
</body>
</html>
